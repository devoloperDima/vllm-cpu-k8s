[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-private-logging"
version = "1.0.0"
description = "vLLM plugin that removes prompts and completions from request logs"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."vllm.general_plugins"]
private_logging = "vllm_private_logging:register"

[tool.setuptools.packages.find]
where = ["src"]
