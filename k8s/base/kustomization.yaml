apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-inference

labels:
  - pairs:
      app.kubernetes.io/part-of: vllm-cpu
    includeSelectors: false

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: vllm-model
    envs:
      - config/model.env
  - name: vllm-serve-config
    files:
      - serve.yaml=config/serve.yaml

images:
  - name: vllm-cpu-private
    newTag: 0.32.0
  - name: vllm-model-downloader
    newTag: 1.0.0
